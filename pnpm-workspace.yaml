packages:
  - "."

catalogs: {}

overrides:
  devalue: "5.9.4"
  dompurify: "3.4.16"
  esbuild: "0.28.2"
  fast-uri: "3.1.8"
  js-yaml: "4.3.2"
  katex: "0.18.2"
  nanoid: "3.3.20"
  postcss: "8.5.29"
  sharp: "0.35.5"
  smol-toml: "1.9.1"
  source-map-js: "1.2.2"
  svgo: "4.1.0"
  tinypool: "2.1.2"
  vite: "8.2.2"
  yaml: "2.8.3"

allowBuilds:
  esbuild: true
  sharp: true

auditConfig:
  ignoreCves: []

# Reject packages published less than 7 days ago to reduce supply-chain attack risk.
# Value is in minutes: 7 days × 24 h × 60 min = 10080
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Security remediation: DOMPurify detached subtree XSS.
  - dompurify@3.4.13
  # Renovate security update: mermaid@11.16.1
  - mermaid@11.16.1
  # Security remediation: nanoid zero-size infinite loop. || 3.3.18
  - nanoid@3.3.17 || 3.3.18
  # Renovate security update: fast-uri@3.1.5 || 3.1.6
  - fast-uri@3.1.5 || 3.1.6
  # Renovate security update: js-yaml@4.3.1
  - js-yaml@4.3.1
  # Renovate security update: astro@7.1.0 || 7.2.8
  - astro@7.1.0 || 7.2.8
  # Renovate security update: sharp@0.35.4
  - sharp@0.35.4
  # Renovate security update: svgo@4.1.0
  - svgo@4.1.0
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
