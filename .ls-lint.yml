ls:
  .dir: regex:\.?[a-z0-9]+(-[a-z0-9]+)*
  .*: regex:[a-z0-9]*([._][a-z0-9]+)*

ignore:
  - .git
  - .direnv
  - result
  - result-*
  - docs/logs

  - README.md
  - CLAUDE.md
  - CONTENT_LICENSE.md
  - docs/adr

  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - node_modules
  - .pnpm-store
  - .astro
  - dist
  - build
  - coverage
  - playwright-report
  - test-results
  - .next
  - out
  - .nuxt
  - .output
  - .svelte-kit
  - .turbo
  - .vite
  - src/pages
