ls:
  .dir: regex:\.?[a-z0-9]+(-[a-z0-9]+)*
  .md: regex:[a-z0-9]*([._][a-z0-9]+)* | regex:(README|CONTRIBUTING|CHANGELOG|AGENTS|CLAUDE|SKILL|CONTENT_LICENSE)
  .yaml: regex:[a-z0-9]*([._][a-z0-9]+)* | regex:pnpm-(lock|workspace)
  .*: regex:[a-z0-9]*([._][a-z0-9]+)*

ignore:
  - .git
  - .direnv
  - result
  - result-*
  - "{.venv,.uv-cache,.ruff_cache,.pytest_cache,.ipynb_checkpoints,__pycache__,node_modules,target}"
  - "**/{.venv,.uv-cache,.ruff_cache,.pytest_cache,.ipynb_checkpoints,__pycache__,node_modules,target}"
  - docs/logs
  - "**/docs/logs"
  - articles
  - docs/adr

  - "{.pnpm-store,.astro,.turbo,.vite}"
  - "**/{.pnpm-store,.astro,.turbo,.vite}"
  - "{dist,build,coverage,playwright-report,test-results,.next,out,.nuxt,.output,.svelte-kit}"
  - "**/{dist,build,coverage,playwright-report,test-results,.next,out,.nuxt,.output,.svelte-kit}"
  - src/pages
